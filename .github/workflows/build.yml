name: Build PonWrt AN7581 HG5382A

on:
  # 手动运行
  workflow_dispatch:

  # 每天北京时间 04:00 检查上游更新
  # GitHub Actions 使用 UTC
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: write

env:
  PONWRT_REPO: https://github.com/pbs05/ponwrt.git
  PONWRT_BRANCH: master
  TARGET_DIR: bin/targets/airoha/an7581

jobs:

  # ==========================================================
  # 检查 pbs05/ponwrt 是否更新
  # ==========================================================
  check-update:
    name: Check PonWrt Update
    runs-on: ubuntu-24.04

    outputs:
      commit: ${{ steps.version.outputs.commit }}
      short_commit: ${{ steps.version.outputs.short_commit }}
      tag: ${{ steps.version.outputs.tag }}
      need_build: ${{ steps.version.outputs.need_build }}

    steps:

      # --------------------------------------------------------
      # Checkout 当前构建仓库
      # --------------------------------------------------------
      - name: Checkout build repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # --------------------------------------------------------
      # 获取上游最新 commit
      # --------------------------------------------------------
      - name: Check latest PonWrt commit
        id: version
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Checking PonWrt"
          echo "========================================"

          COMMIT="$(
            git ls-remote \
              "${PONWRT_REPO}" \
              "refs/heads/${PONWRT_BRANCH}" \
              | awk '{print $1}'
          )"

          if [ -z "${COMMIT}" ]; then
            echo "ERROR: Unable to get PonWrt commit."
            exit 1
          fi

          SHORT_COMMIT="${COMMIT:0:12}"
          TAG="ponwrt-an7581-${SHORT_COMMIT}"

          echo
          echo "Latest PonWrt commit:"
          echo "${COMMIT}"

          echo
          echo "Short commit:"
          echo "${SHORT_COMMIT}"

          echo
          echo "Release tag:"
          echo "${TAG}"

          echo "commit=${COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "short_commit=${SHORT_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

          # ----------------------------------------------------
          # 手动运行：强制编译
          # ----------------------------------------------------
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo
            echo "Manual workflow dispatch detected."
            echo "Build will be forced."

            echo "need_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # ----------------------------------------------------
          # 自动运行：
          # 检查这个 commit 是否已经成功发布
          # ----------------------------------------------------
          echo
          echo "Checking existing release..."

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}"
          )"

          echo "GitHub API response: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" = "200" ]; then
            echo
            echo "This PonWrt commit has already been built."
            echo "Skipping build."

            echo "need_build=false" >> "${GITHUB_OUTPUT}"
          else
            echo
            echo "This PonWrt commit has not been built yet."
            echo "Build required."

            echo "need_build=true" >> "${GITHUB_OUTPUT}"
          fi


  # ==========================================================
  # 编译 PonWrt
  # ==========================================================
  build:
    name: Build AN7581 HG5382A

    needs: check-update

    if: needs.check-update.outputs.need_build == 'true'

    runs-on: ubuntu-24.04

    steps:

      # ========================================================
      # 非常重要：
      # 每个 Job 都是独立 Runner
      # 所以这里必须再次 checkout 当前仓库
      # 这样才能拿到 hg5382a.config
      # ========================================================
      - name: Checkout build repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ========================================================
      # 检查自定义配置文件
      # ========================================================
      - name: Verify custom configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify custom configuration"
          echo "========================================"

          CONFIG_FILE="${GITHUB_WORKSPACE}/hg5382a.config"

          echo "Workspace:"
          echo "${GITHUB_WORKSPACE}"

          echo
          echo "Config file:"
          echo "${CONFIG_FILE}"

          if [ ! -f "${CONFIG_FILE}" ]; then
            echo
            echo "ERROR: hg5382a.config not found."
            echo
            echo "Workspace contents:"
            find "${GITHUB_WORKSPACE}" -maxdepth 2 -type f | sort
            exit 1
          fi

          echo
          echo "hg5382a.config found."

          echo
          echo "File size:"
          wc -l "${CONFIG_FILE}"

          echo
          echo "Target configuration:"
          grep -E \
            '^CONFIG_TARGET_airoha|^CONFIG_TARGET_DEVICE_airoha' \
            "${CONFIG_FILE}" || true

      # ========================================================
      # Clone PonWrt
      #
      # 注意：
      # 不直接 clone 最新 master 后编译。
      # 而是 checkout check-update 检查到的那个 commit。
      #
      # 这样可以保证：
      #
      # 检查 commit = 实际编译 commit
      # ========================================================
      - name: Clone PonWrt
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Clone PonWrt"
          echo "========================================"

          git clone \
            "${PONWRT_REPO}" \
            ponwrt

          cd ponwrt

          echo
          echo "Fetching target commit..."

          git fetch \
            --depth=1 \
            origin \
            "${{ needs.check-update.outputs.commit }}"

          git checkout \
            --detach \
            "${{ needs.check-update.outputs.commit }}"

          echo
          echo "PonWrt commit:"
          git rev-parse HEAD

          echo
          echo "Expected commit:"
          echo "${{ needs.check-update.outputs.commit }}"

          # ----------------------------------------------------
          # 验证实际 checkout 的 commit
          # ----------------------------------------------------
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          EXPECTED_COMMIT="${{ needs.check-update.outputs.commit }}"

          if [ "${ACTUAL_COMMIT}" != "${EXPECTED_COMMIT}" ]; then
            echo
            echo "ERROR: PonWrt commit mismatch!"
            echo "Actual:   ${ACTUAL_COMMIT}"
            echo "Expected: ${EXPECTED_COMMIT}"
            exit 1
          fi

          echo
          echo "Commit verification passed."

      # ========================================================
      # 显示 PonWrt 版本
      # ========================================================
      - name: Show PonWrt version
        working-directory: ponwrt
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PonWrt version"
          echo "========================================"

          git log -1 --oneline

          echo
          echo "Full commit:"
          git rev-parse HEAD

          echo
          echo "Remote:"
          git remote -v

      # ========================================================
      # 安装编译依赖
      # ========================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Install build dependencies"
          echo "========================================"

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            haveged \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            libz-dev \
            lld \
            llvm \
            lrzsz \
            mkisofs \
            msmtp \
            nano \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-ply \
            python3-docutils \
            python3-pyelftools \
            qemu-utils \
            re2c \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            zstd

      # ========================================================
      # 更新 feeds
      # ========================================================
      - name: Update feeds
        working-directory: ponwrt
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Update feeds"
          echo "========================================"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ========================================================
      # 使用自定义 hg5382a.config
      # ========================================================
      - name: Configure HG5382A
        working-directory: ponwrt
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Configure HG5382A"
          echo "========================================"

          CONFIG_FILE="${GITHUB_WORKSPACE}/hg5382a.config"

          if [ ! -f "${CONFIG_FILE}" ]; then
            echo "ERROR: ${CONFIG_FILE} not found."
            exit 1
          fi

          echo
          echo "Using:"
          echo "${CONFIG_FILE}"

          cp configs/an7581.config .config

          echo
          echo "Target configuration before defconfig:"
          echo "----------------------------------------"

          grep -E \
            '^CONFIG_TARGET_airoha|^CONFIG_TARGET_DEVICE_airoha' \
            .config || true

          echo
          echo "Running make defconfig..."
          echo

          make defconfig

      # ========================================================
      # 验证目标设备
      # ========================================================
      - name: Verify HG5382A target
        working-directory: ponwrt
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify target"
          echo "========================================"

          echo
          echo "Target:"
          grep '^CONFIG_TARGET_airoha=y$' .config

          echo
          echo "AN7581:"
          grep '^CONFIG_TARGET_airoha_an7581=y$' .config

          echo
          echo "HG5382A:"
          grep \
            '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5382a=y$' \
            .config

          echo
          echo "Architecture:"
          grep '^CONFIG_TARGET_ARCH_PACKAGES=' .config || true

          echo
          echo "CPU:"
          grep '^CONFIG_CPU_TYPE=' .config || true

          echo
          echo "Linux version:"
          grep '^CONFIG_LINUX_' .config || true

      # ========================================================
      # 显示最终配置摘要
      # ========================================================
      - name: Show final configuration summary
        working-directory: ponwrt
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Final configuration summary"
          echo "========================================"

          echo
          echo "Target:"
          grep '^CONFIG_TARGET_airoha' .config || true

          echo
          echo "Device:"
          grep '^CONFIG_TARGET_DEVICE_airoha' .config || true

          echo
          echo "Packages:"
          grep '^CONFIG_PACKAGE_' .config | sort || true

      # ========================================================
      # 编译
      # ========================================================
      - name: Build PonWrt AN7581
        working-directory: ponwrt
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build PonWrt AN7581 HG5382A"
          echo "========================================"

          echo
          echo "CPU cores:"
          nproc

          echo
          echo "Starting build..."

          make -j"$(nproc)"

      # ========================================================
      # 检查编译结果
      # ========================================================
      - name: Verify build output
        working-directory: ponwrt
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify build output"
          echo "========================================"

          if [ ! -d "${TARGET_DIR}" ]; then
            echo
            echo "ERROR: Target directory does not exist:"
            echo "${TARGET_DIR}"
            exit 1
          fi

          echo
          echo "Target directory:"
          echo "${TARGET_DIR}"

          echo
          echo "Firmware files:"
          echo "----------------------------------------"

          find "${TARGET_DIR}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "File count:"

          find "${TARGET_DIR}" \
            -maxdepth 1 \
            -type f \
            | wc -l

      # ========================================================
      # 生成 SHA256
      # ========================================================
      - name: Generate SHA256SUMS
        working-directory: ponwrt
        shell: bash
        run: |
          set -euo pipefail

          cd "${TARGET_DIR}"

          echo "========================================"
          echo "Generate SHA256SUMS"
          echo "========================================"

          rm -f SHA256SUMS

          find . \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.bin' \
              -o -name '*.itb' \
              -o -name '*.img' \
              -o -name '*.gz' \
              -o -name '*.manifest' \
              -o -name '*.json' \
            \) \
            -printf '%f\n' \
            | sort \
            | xargs -r sha256sum \
            > SHA256SUMS

          echo
          echo "SHA256:"
          echo "----------------------------------------"

          cat SHA256SUMS

      # ========================================================
      # 保存最终 .config
      # ========================================================
      - name: Save final configuration
        shell: bash
        run: |
          set -euo pipefail

          cp \
            ponwrt/.config \
            "ponwrt/${TARGET_DIR}/hg5382a.final.config"

      # ========================================================
      # 保存原始配置
      # ========================================================
      - name: Save source configuration
        shell: bash
        run: |
          set -euo pipefail

          cp \
            "${GITHUB_WORKSPACE}/hg5382a.config" \
            "ponwrt/${TARGET_DIR}/hg5382a.config"

      # ========================================================
      # 保存编译信息
      # ========================================================
      - name: Generate build information
        working-directory: ponwrt
        shell: bash
        run: |
          set -euo pipefail

          COMMIT="$(git rev-parse HEAD)"

          cat > "${TARGET_DIR}/BUILD_INFO.txt" <<EOF
          PonWrt Build Information
          =========================

          Repository:
          https://github.com/pbs05/ponwrt

          Branch:
          ${PONWRT_BRANCH}

          Commit:
          ${COMMIT}

          Target:
          Airoha AN7581

          Device:
          FiberHome HG5382A

          Configuration:
          hg5382a.config

          Build time:
          $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF

          echo
          cat "${TARGET_DIR}/BUILD_INFO.txt"

      # ========================================================
      # 上传 GitHub Actions Artifact
      # ========================================================
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7581-hg5382a-${{ needs.check-update.outputs.short_commit }}
          path: ponwrt/${{ env.TARGET_DIR }}/*
          if-no-files-found: error
          retention-days: 30

      # ========================================================
      # 创建 GitHub Release
      # ========================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-update.outputs.tag }}

          name: PonWrt AN7581 HG5382A ${{ needs.check-update.outputs.short_commit }}

          body: |
            ## PonWrt AN7581 / HG5382A

            Automatic build from:

            - Repository: https://github.com/pbs05/ponwrt
            - Branch: `${{ env.PONWRT_BRANCH }}`
            - Commit: `${{ needs.check-update.outputs.commit }}`

            ### Target

            - Airoha AN7581
            - FiberHome HG5382A

            ### Configuration

            - Custom `hg5382a.config`
            - `make defconfig`

            ### Build

            - `make -j$(nproc)`

            ### Included files

            - Firmware images
            - `SHA256SUMS`
            - `hg5382a.config`
            - `hg5382a.final.config`
            - `BUILD_INFO.txt`

          generate_release_notes: true

          files: |
            ponwrt/${{ env.TARGET_DIR }}/*
