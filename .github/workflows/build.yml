name: Build PonWrt AN7581 HG5382A

on:
  # 手动运行
  workflow_dispatch:

  # 每天北京时间 04:00 检查上游更新
  # GitHub Actions 使用 UTC
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: write

env:
  PONWRT_REPO: https://github.com/pbs05/ponwrt.git
  PONWRT_BRANCH: master
  TARGET_DIR: bin/targets/airoha/an7581

jobs:

  # ============================================================
  # 检查 pbs05/ponwrt 是否更新
  # ============================================================

  check-update:
    name: Check PonWrt Update
    runs-on: ubuntu-24.04

    outputs:
      commit: ${{ steps.version.outputs.commit }}
      short_commit: ${{ steps.version.outputs.short_commit }}
      tag: ${{ steps.version.outputs.tag }}
      need_build: ${{ steps.version.outputs.need_build }}

    steps:

      # ----------------------------------------------------------
      # Checkout 当前构建仓库
      # ----------------------------------------------------------

      - name: Checkout build repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ----------------------------------------------------------
      # 检查 PonWrt 最新 commit
      # ----------------------------------------------------------

      - name: Check latest PonWrt commit
        id: version
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking PonWrt"
          echo "========================================"

          COMMIT=$(git ls-remote \
            "${PONWRT_REPO}" \
            "refs/heads/${PONWRT_BRANCH}" \
            | awk '{print $1}')

          if [ -z "$COMMIT" ]; then
            echo "ERROR: Unable to get PonWrt commit."
            exit 1
          fi

          SHORT_COMMIT="${COMMIT:0:12}"
          TAG="ponwrt-an7581-${SHORT_COMMIT}"

          echo
          echo "Latest PonWrt commit:"
          echo "$COMMIT"

          echo
          echo "Short commit:"
          echo "$SHORT_COMMIT"

          echo
          echo "Release tag:"
          echo "$TAG"

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short_commit=$SHORT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # ------------------------------------------------------
          # 手动运行：强制编译
          # ------------------------------------------------------

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo
            echo "Manual workflow dispatch detected."
            echo "Build will be forced."

            echo "need_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ------------------------------------------------------
          # 自动运行：
          # 检查这个 commit 是否已经成功发布
          # ------------------------------------------------------

          echo
          echo "Checking existing release..."

          HTTP_CODE=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")

          echo "GitHub API response: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then

            echo
            echo "This PonWrt commit has already been built."
            echo "Skipping build."

            echo "need_build=false" >> "$GITHUB_OUTPUT"

          else

            echo
            echo "New PonWrt commit detected."
            echo "Build required."

            echo "need_build=true" >> "$GITHUB_OUTPUT"

          fi


  # ============================================================
  # 编译 AN7581 / HG5382A
  # ============================================================

  build:
    name: Build AN7581 HG5382A

    needs: check-update

    if: needs.check-update.outputs.need_build == 'true'

    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # Clone PonWrt
      # ==========================================================

      - name: Clone PonWrt
        run: |
          set -e

          echo "========================================"
          echo "Clone PonWrt"
          echo "========================================"

          git clone \
            --depth=1 \
            --branch "${PONWRT_BRANCH}" \
            "${PONWRT_REPO}" \
            ponwrt

      # ==========================================================
      # 显示 PonWrt 版本
      # ==========================================================

      - name: Show PonWrt version
        working-directory: ponwrt
        run: |
          set -e

          echo "========================================"
          echo "PonWrt version"
          echo "========================================"

          git log -1 --oneline

          echo
          echo "Full commit:"
          git rev-parse HEAD

      # ==========================================================
      # 安装编译依赖
      # ==========================================================

      - name: Install build dependencies
        run: |
          set -e

          echo "========================================"
          echo "Install build dependencies"
          echo "========================================"

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            haveged \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            libz-dev \
            lld \
            llvm \
            lrzsz \
            mkisofs \
            msmtp \
            nano \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-ply \
            python3-docutils \
            python3-pyelftools \
            qemu-utils \
            re2c \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            zstd

      # ==========================================================
      # 更新 feeds
      # ==========================================================

      - name: Update feeds
        working-directory: ponwrt
        run: |
          set -e

          echo "========================================"
          echo "Update feeds"
          echo "========================================"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ==========================================================
      # 使用仓库中的 hg5382a.config
      # ==========================================================

      - name: Configure HG5382A
        working-directory: ponwrt
        run: |
          set -e

          echo "========================================"
          echo "Configure HG5382A"
          echo "========================================"

          if [ ! -f ../hg5382a.config ]; then
            echo "ERROR: hg5382a.config not found."
            exit 1
          fi

          cp ../hg5382a.config .config

          echo
          echo "Target configuration before defconfig:"
          echo "----------------------------------------"

          grep -E \
            'CONFIG_TARGET_airoha|CONFIG_TARGET_DEVICE_airoha' \
            .config || true

          echo
          echo "Running make defconfig..."
          echo

          make defconfig

      # ==========================================================
      # 验证目标设备
      # ==========================================================

      - name: Verify HG5382A target
        working-directory: ponwrt
        run: |
          set -e

          echo "========================================"
          echo "Verify target"
          echo "========================================"

          echo
          echo "Target:"
          grep '^CONFIG_TARGET_airoha=y$' .config

          echo
          echo "AN7581:"
          grep '^CONFIG_TARGET_airoha_an7581=y$' .config

          echo
          echo "HG5382A:"
          grep '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5382a=y$' .config

          echo
          echo "Architecture:"
          grep '^CONFIG_TARGET_ARCH_PACKAGES=' .config || true

          echo
          echo "CPU:"
          grep '^CONFIG_CPU_TYPE=' .config || true

      # ==========================================================
      # 编译
      # ==========================================================

      - name: Build PonWrt AN7581
        working-directory: ponwrt
        run: |
          set -e

          echo "========================================"
          echo "Build PonWrt AN7581 HG5382A"
          echo "========================================"

          echo
          echo "CPU cores:"
          nproc

          echo
          echo "Starting build..."

          make -j"$(nproc)"

      # ==========================================================
      # 检查编译结果
      # ==========================================================

      - name: Verify build output
        working-directory: ponwrt
        run: |
          set -e

          echo "========================================"
          echo "Verify build output"
          echo "========================================"

          if [ ! -d "${TARGET_DIR}" ]; then
            echo
            echo "ERROR: Target directory does not exist:"
            echo "${TARGET_DIR}"
            exit 1
          fi

          echo
          echo "Firmware files:"
          echo "----------------------------------------"

          find "${TARGET_DIR}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "File count:"
          find "${TARGET_DIR}" \
            -maxdepth 1 \
            -type f \
            | wc -l

      # ==========================================================
      # 生成 SHA256
      # ==========================================================

      - name: Generate SHA256SUMS
        working-directory: ponwrt
        run: |
          set -e

          cd "${TARGET_DIR}"

          echo "========================================"
          echo "Generate SHA256SUMS"
          echo "========================================"

          rm -f SHA256SUMS

          find . \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.bin' \
              -o -name '*.itb' \
              -o -name '*.img' \
              -o -name '*.gz' \
              -o -name '*.manifest' \
              -o -name '*.json' \
            \) \
            -printf '%f\n' \
            | sort \
            | xargs -r sha256sum \
            > SHA256SUMS

          echo
          cat SHA256SUMS

      # ==========================================================
      # 保存最终 .config
      # ==========================================================

      - name: Save final configuration
        run: |
          set -e

          cp \
            ponwrt/.config \
            "ponwrt/${TARGET_DIR}/hg5382a.final.config"

      # ==========================================================
      # 保存编译信息
      # ==========================================================

      - name: Generate build information
        working-directory: ponwrt
        run: |
          set -e

          COMMIT=$(git rev-parse HEAD)

          cat > "${TARGET_DIR}/BUILD_INFO.txt" <<EOF
          PonWrt Build Information
          =========================

          Repository:
          https://github.com/pbs05/ponwrt

          Branch:
          ${PONWRT_BRANCH}

          Commit:
          ${COMMIT}

          Target:
          Airoha AN7581

          Device:
          FiberHome HG5382A

          Configuration:
          hg5382a.config

          Build time:
          $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF

          cat "${TARGET_DIR}/BUILD_INFO.txt"

      # ==========================================================
      # 上传 GitHub Actions Artifact
      # ==========================================================

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7581-hg5382a-${{ needs.check-update.outputs.short_commit }}
          path: ponwrt/${{ env.TARGET_DIR }}/*
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 创建 GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-update.outputs.tag }}
          name: PonWrt AN7581 HG5382A ${{ needs.check-update.outputs.short_commit }}

          body: |
            ## PonWrt AN7581 / HG5382A

            Automatic build from:

            - Repository: https://github.com/pbs05/ponwrt
            - Branch: `${{ env.PONWRT_BRANCH }}`
            - Commit: `${{ needs.check-update.outputs.commit }}`

            Target:

            - Airoha AN7581
            - FiberHome HG5382A

            Configuration:

            - `hg5382a.config`

            Build:

            - `make defconfig`
            - `make -j$(nproc)`

          generate_release_notes: true

          files: |
            ponwrt/${{ env.TARGET_DIR }}/*
